
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duckcraft</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:monospace;background:#87ceeb}
canvas{display:block}
#title{position:fixed;top:14px;left:18px;color:white;font-size:22px;text-shadow:2px 2px #444;pointer-events:none}
#help{position:fixed;top:15px;right:15px;padding:12px;background:#0005;color:white;font-size:12px;line-height:1.8;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:22px;text-shadow:1px 1px #333;pointer-events:none}
#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:none}
.slot{width:49px;height:49px;border:2px solid #777;background:#222a;display:grid;place-items:center;color:white}
.slot.active{border:3px solid white;background:#777a}
.swatch{width:25px;height:25px;border:1px solid #ffffff55}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0006}
#panel{background:#ddd;border:3px solid white;box-shadow:5px 5px #555;padding:28px;text-align:center;width:min(360px,90%)}
h1{font-size:38px;margin:0;color:#333}
button{background:#777;color:white;border:2px solid white;padding:12px 32px;font:18px monospace;cursor:pointer}
#status{position:fixed;top:60px;left:18px;color:white;text-shadow:1px 1px #333;pointer-events:none}
</style>
</head>
<body>
<div id="title">Duckcraft</div>
<div id="status">Flatland</div>
<div id="help">WASD — Move<br>Mouse — Look<br>SPACE — Jump<br>Left click — Break<br>Right click — Place<br>1–4 — Select block<br>ESC — Pause</div>
<div id="cross">+</div>
<div id="bar"></div>
<div id="overlay"><div id="panel">
<h1>Duckcraft</h1>
<p>A quiet little block world.</p>
<p>Build whatever you want.</p>
<button id="play">Play</button>
<p style="font-size:11px">WASD to move · Mouse to look</p>
</div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,100);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777766,2));
const sun=new THREE.DirectionalLight(0xffffff,1.4);
sun.position.set(-30,60,20);
scene.add(sun);

function texture(color,variation=18){
 const c=document.createElement("canvas");c.width=c.height=16;
 const ctx=c.getContext("2d");ctx.fillStyle=color;ctx.fillRect(0,0,16,16);
 const n=parseInt(color.slice(1),16);
 const r=n>>16,g=n>>8&255,b=n&255;
 for(let i=0;i<90;i++){
  const d=Math.floor(Math.random()*variation*2)-variation;
  ctx.fillStyle=`rgb(${Math.max(0,Math.min(255,r+d))},${Math.max(0,Math.min(255,g+d))},${Math.max(0,Math.min(255,b+d))})`;
  ctx.fillRect(Math.random()*16|0,Math.random()*16|0,1,1);
 }
 const t=new THREE.CanvasTexture(c);
 t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
 t.colorSpace=THREE.SRGBColorSpace;return t;
}
const mat={
 grass:new THREE.MeshLambertMaterial({map:texture("#65a844")}),
 dirt:new THREE.MeshLambertMaterial({map:texture("#866043")}),
 stone:new THREE.MeshLambertMaterial({map:texture("#858585")}),
 wood:new THREE.MeshLambertMaterial({map:texture("#987044")})
};
const grassSide=new THREE.MeshLambertMaterial({map:texture("#659b42")});
const grassM=[grassSide,grassSide,mat.grass,mat.dirt,grassSide,grassSide];
const geo=new THREE.BoxGeometry(1,1,1);
const blocks=new Map(),meshes=[];
const key=(x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,type="grass"){
 x=Math.round(x);y=Math.round(y);z=Math.round(z);
 const k=key(x,y,z);if(blocks.has(k))return;
 const mesh=new THREE.Mesh(geo,type==="grass"?grassM:mat[type]||mat.dirt);
 mesh.position.set(x,y,z);mesh.userData={x,y,z,type};
 scene.add(mesh);blocks.set(k,mesh);meshes.push(mesh);
}
function removeBlock(m){
 const {x,y,z}=m.userData;
 blocks.delete(key(x,y,z));scene.remove(m);
 const i=meshes.indexOf(m);if(i>=0)meshes.splice(i,1);
}

// Completely flat world: grass at y=0.
const SIZE=48;
for(let x=-SIZE/2;x<SIZE/2;x++){
 for(let z=-SIZE/2;z<SIZE/2;z++){
  addBlock(x,0,z,"grass");
  addBlock(x,-1,z,"dirt");
  addBlock(x,-2,z,"dirt");
  addBlock(x,-3,z,"stone");
 }
}

// Player and controls.
const player=new THREE.Vector3(0,2.7,0);
const keys={};
let yaw=0,pitch=0,vy=0,grounded=true;
const ray=new THREE.Raycaster();ray.far=6;

const types=[
 {name:"grass",color:"#65a844"},
 {name:"dirt",color:"#866043"},
 {name:"stone",color:"#858585"},
 {name:"wood",color:"#987044"}
];
let selected=0;
const bar=document.querySelector("#bar");
types.forEach((t,i)=>{
 const el=document.createElement("div");
 el.className="slot"+(i===0?" active":"");
 el.innerHTML=`<div class="swatch" style="background:${t.color}"></div><small>${i+1}</small>`;
 bar.appendChild(el);
});
function select(n){
 selected=(n+types.length)%types.length;
 [...bar.children].forEach((e,i)=>e.classList.toggle("active",i===selected));
}

const overlay=document.querySelector("#overlay");
document.querySelector("#play").onclick=()=>renderer.domElement.requestPointerLock();
document.addEventListener("pointerlockchange",()=>{
 overlay.style.display=document.pointerLockElement===renderer.domElement?"none":"grid";
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.002;pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.54,1.54);
});
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space")e.preventDefault();
 if(/^Digit[1-4]$/.test(e.code))select(Number(e.code.slice(5))-1);
 if(e.code==="Space"&&grounded){vy=8;grounded=false;}
});
document.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("contextmenu",e=>e.preventDefault());

function getHit(){
 camera.position.copy(player);
 camera.rotation.set(pitch,yaw,0,"YXZ");
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 return ray.intersectObjects(meshes,false)[0];
}
document.addEventListener("mousedown",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 if(e.button!==0&&e.button!==2)return;
 const hit=getHit();if(!hit)return;
 if(e.button===0){
  if(hit.object.userData.y<=-3)return;
  removeBlock(hit.object);
 }else{
  const p=hit.object.position.clone().add(hit.face.normal);
  const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);
  if(Math.abs(x-player.x)<.8&&Math.abs(z-player.z)<.8&&y>=player.y-1.7&&y<=player.y+.2)return;
  addBlock(x,y,z,types[selected].name);
 }
});

function update(dt){
 const speed=keys.ShiftLeft?8:5;
 const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const m=new THREE.Vector3();
 if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);
 if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);
 if(m.lengthSq())m.normalize().multiplyScalar(speed*dt);
 player.x=THREE.MathUtils.clamp(player.x+m.x,-23,23);
 player.z=THREE.MathUtils.clamp(player.z+m.z,-23,23);

 vy-=22*dt;player.y+=vy*dt;
 if(player.y<=2.7){player.y=2.7;vy=0;grounded=true;}
 camera.position.copy(player);camera.rotation.set(pitch,yaw,0,"YXZ");
}

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);last=now;
 update(dt);renderer.render(scene,camera);
}
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
animate(performance.now());
</script>
</body>
</html>
